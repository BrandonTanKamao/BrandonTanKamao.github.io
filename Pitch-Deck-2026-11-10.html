 out.push('<div class="slide sys"><span class="hook">Debugging</span><h2>'+esc(D.debug.hook)+'</h2><div class="card blush"><strong>'+esc(D.debug.lead[0])+'</strong><p>'+esc(D.debug.lead[1])+'</p></div><div class="grid g3">'+D.debug.cards.map(([t,d])=>'<div class="card"><strong>'+esc(t)+'</strong><p class="mute">'+esc(d)+'</p></div>').join('')+'</div></div>');
 out.push('<div class="slide"><span class="hook">By the numbers</span><h2>What would these look like in your account?</h2>'+nums(V.headline,'g3')+'<p class="mute">Every figure is measured from the account or a dated record, and I can show the source on a call. No revenue claims: the client does not share revenue with me, so I do not quote it.</p></div>');
 out.push('<div class="slide"><span class="hook">How I work</span><h2>Why does nothing break quietly?</h2><div class="grid g3">'+D.how.map(([t,d])=>'<div class="card"><strong>'+esc(t)+'</strong><p class="mute">'+esc(d)+'</p></div>').join('')+'</div></div>');
 out.push('<div class="slide"><span class="hook">The objection</span><h2>&ldquo;'+esc(V.objection[0])+'&rdquo;</h2><p class="big">'+esc(V.objection[1])+'</p></div>');
 out.push('<div class="slide"><span class="hook">Next step</span><h2>'+esc(V.offer[0])+'</h2><p class="big">'+esc(V.offer[1])+'</p><p><a class="pill" href="'+D.koa+'">Book a 20 minute call</a> &nbsp; <a class="pill ghost" href="'+D.site+'">See the portfolio</a></p></div>');
 return out;
}
let i=0;const stage=document.getElementById('stage');
function render(){stage.innerHTML=slides(cur).join('');show(0);}
function show(n){const s=stage.children;i=Math.max(0,Math.min(s.length-1,n));for(let k=0;k<s.length;k++)s[k].classList.toggle('on',k===i);document.getElementById('ctr').textContent=(i+1)+' / '+s.length;}
sel.onchange=()=>{cur=sel.value;history.replaceState(null,'','?for='+cur);render();};
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);
addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='PageDown')show(i+1);if(ev.key==='ArrowLeft'||ev.key==='PageUp')show(i-1);if(ev.key==='Home')show(0);});
render();
</script></body></html>
